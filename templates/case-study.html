<!-- Case study page template. Do not edit the generated pages; edit this file or content/case-study-pages/, then run: node scripts/build-site.mjs -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} | Ji-Sook Yim</title>
<meta name="description" content="{{cta_text}}">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../components/site.css">
<link rel="stylesheet" href="../components/theme-departure-board.css">
<link rel="stylesheet" href="../components/case-study.css">
</head>
<body class="cs-page" data-route="{{route}}" style="--route: var(--{{route}})">

<div class="cs-nav-band">
{{site_header}}
</div>

<main class="case-study">

  <div class="cs-hero-band">
  <div class="page-width cs-hero">
    <div class="cs-ticket">
      <div class="cs-ticket-main">
    <h1 class="cs-title">{{title}}</h1>
    <div class="cs-route">
      <div><p class="cs-k">From</p><p class="cs-v">{{from}}</p></div>
      <div class="cs-plane" aria-hidden="true"><svg class="plane" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" focusable="false"><path transform="rotate(90 12 12)" d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg></div>
      <div class="cs-to"><p class="cs-k">To</p><p class="cs-v">{{to}}</p></div>
    </div>
    <p class="cs-summary">{{summary}}</p>
      </div>
      <span class="cs-notch" aria-hidden="true"></span>
      <dl class="cs-stub">
{{details}}
      </dl>
    </div>
    <img class="cs-cover" src="../{{image_src}}" alt="{{cover_alt}}" width="{{cover_width}}" height="{{cover_height}}">
  </div>
  </div>

  <div class="cs-body">
{{sections}}
  </div>

</main>

{{site_footer}}

</body>
</html>
