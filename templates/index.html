<!-- Homepage template. Do not edit index.html at the root; edit this file, then run: node scripts/build-site.mjs
     {{tickets}} is filled with one boarding pass per file in content/case-studies/.
     {{recommendations}} is filled with one recommendation card per file in content/recommendations/. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ji-Sook Yim | Product &amp; UX Design</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="components/site.css">
<link rel="stylesheet" href="components/boarding-pass.css">
<link rel="stylesheet" href="components/hero.css">
<link rel="stylesheet" href="components/passport.css">
<link rel="stylesheet" href="components/recommendation.css">
</head>
<body>

<header class="site-nav">
  <a class="site-name" href="index.html">Ji-Sook Yim</a>
  <nav>
    <ul>
      <li><a href="#">AI Lab</a></li>
      <li><a href="#">Resume</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>
</header>

<main>

{{passport}}

  <section class="projects">
    <h2>Featured Work</h2>
    <div class="ticket-grid">
{{tickets}}
    </div>
  </section>

  <section class="testimonials">
    <h2>Recommendations from senior leaders</h2>
    <div class="rec-grid">
{{recommendations}}
    </div>
  </section>

  <section class="closing">
    <h2>Let's connect!</h2>
    <a class="closing-cta" href="#">Get in touch</a>
  </section>

</main>

<script src="components/hero.js" defer></script>
<script src="components/passport.js" defer></script>
</body>
</html>
