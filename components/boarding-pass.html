<!-- Boarding pass component template. Do not edit individual pages.
     Edit this file, then run: node scripts/build-site.mjs
     Placeholders: title, from, to, image_src, image_alt, cta
     Plane icon: Material Icons "flight" (Apache 2.0), rotated to point right.
     (cta is built by the script from cta_text and cta_href: a link if cta_href is set, plain text if not) -->
<article class="boarding-pass">
  <h3 class="bp-title">{{title}}</h3>
  <div class="bp-route">
    <div class="bp-point"><p class="bp-k">From</p><p class="bp-v">{{from}}</p></div>
    <div class="bp-arrow" aria-hidden="true"><svg class="plane" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" focusable="false"><path transform="rotate(90 12 12)" d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg></div>
    <div class="bp-point bp-to"><p class="bp-k">To</p><p class="bp-v">{{to}}</p></div>
  </div>
  {{cta}}
  <img class="bp-image" src="{{image_src}}" alt="{{image_alt}}">
</article>
